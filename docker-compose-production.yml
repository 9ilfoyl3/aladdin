# ============================================================
# Artoo 应用服务 docker-compose（backend / worker / frontend）
# 镜像名通过 .env 的 IMAGE_* 配置，支持不同架构/镜像库。
#
# 基础设施（etcd/minio/milvus/postgres/redis）已拆到 deploy-middleware/docker-compose.yml，
# 二者通过共享外部网络 arag-network 通信，本文件用服务名（postgres/milvus/redis）直连。
#
# 部署顺序：
#   1) docker network create arag-network                    # 仅首次
#   2) (cd deploy-middleware && docker compose --env-file ../.env up -d)   # 起中间件，等 healthy
#   3) docker compose up -d                                  # 起应用（本文件）
# ============================================================

services:
  backend:
    container_name: arag-backend
    image: ${IMAGE_BACKEND:-artoo-backend:latest}
    # 覆盖镜像默认 CMD：单机多进程，提升并发问答吞吐与单进程崩溃韧性。
    # 进程数由 BACKEND_WORKERS 控制（默认 2，单机建议 2~4，别太大以给 Milvus/模型留内存）。
    # 各 worker 进程的检索/配置缓存经 InvalidationBus(Redis pub/sub) 广播保持一致。
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-2}"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/artoo
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-m3}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_SPARSE_ENABLED=${EMBED_SPARSE_ENABLED:-true}
      - RERANK_BASE_URL=${RERANK_BASE_URL:-}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      # ===== 认证与授权（tenant-rbac-refactor）=====
      # 容器内服务端口固定 8000，对外端口由 BACKEND_PORT 配置。
      # 鉴权始终强制：JWT_SECRET 与 SUPER_ADMIN_* 为启动期硬依赖，缺失则 fail-fast。
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-720}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite_only}
      - CONTENT_VIEW_BOUNDARY_OPEN=${CONTENT_VIEW_BOUNDARY_OPEN:-false}
    volumes:
      - upload_data:/app/data
    restart: unless-stopped

  worker:
    container_name: arag-worker
    image: ${IMAGE_BACKEND:-artoo-backend:latest}
    command: ["python", "-m", "app.worker_main"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/artoo
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-m3}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_SPARSE_ENABLED=${EMBED_SPARSE_ENABLED:-true}
      - RERANK_BASE_URL=${RERANK_BASE_URL:-}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      # 认证（tenant-rbac-refactor）：Worker 同样经 init_db -> bootstrap，需与 backend 一致，
      # 缺 SUPER_ADMIN_* 会在引导阶段 fail-fast。
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - PIPELINE_MAX_CONCURRENT=${PIPELINE_MAX_CONCURRENT:-4}
      - PIPELINE_MAX_RETRIES=${PIPELINE_MAX_RETRIES:-3}
      - PIPELINE_EMBED_BATCH_SIZE=${PIPELINE_EMBED_BATCH_SIZE:-32}
      - PIPELINE_EMBED_CONCURRENCY=${PIPELINE_EMBED_CONCURRENCY:-6}
      - PIPELINE_EMBED_PER_DOC_CONCURRENCY=${PIPELINE_EMBED_PER_DOC_CONCURRENCY:-2}
      - PIPELINE_OCR_CONCURRENCY=${PIPELINE_OCR_CONCURRENCY:-4}
      - PIPELINE_SLOW_LANE_MIN_MB=${PIPELINE_SLOW_LANE_MIN_MB:-50}
      - PIPELINE_SLOW_MAX_CONCURRENT=${PIPELINE_SLOW_MAX_CONCURRENT:-1}
      - PIPELINE_EMBED_MAX_CONNECTIONS=${PIPELINE_EMBED_MAX_CONNECTIONS:-20}
      - PIPELINE_TASK_TIMEOUT_MINUTES=${PIPELINE_TASK_TIMEOUT_MINUTES:-30}
      - PIPELINE_CIRCUIT_BREAKER_THRESHOLD=${PIPELINE_CIRCUIT_BREAKER_THRESHOLD:-5}
      - PIPELINE_HEALTH_CHECK_INTERVAL=${PIPELINE_HEALTH_CHECK_INTERVAL:-30}
    volumes:
      - upload_data:/app/data
      - ${MODEL_DIR:-./models}:/root/.cache/huggingface/hub
    restart: unless-stopped

  frontend:
    container_name: arag-frontend
    image: ${IMAGE_FRONTEND:-artoo-frontend:latest}
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  upload_data:

networks:
  default:
    name: arag-network
