# ============================================================
# Artoo 中间件（基础设施）docker-compose —— 独立管理
# 含：etcd / minio / milvus / postgres / redis
#
# 与应用服务（backend/worker/frontend）通过共享外部网络 arag-network 通信，
# 应用 compose 用服务名（postgres/milvus/redis）即可直连本组件。
#
# 用法（在本目录内执行；--env-file 指向上层与应用共用的 .env）：
#   docker network create arag-network          # 仅首次，创建共享网络
#   docker compose --env-file ../.env up -d      # 启动中间件
#   docker compose --env-file ../.env ps         # 等全部 healthy 再启动应用
#   docker compose --env-file ../.env down       # 停止（数据卷保留）
#
# 注：本组件只用到 IMAGE_*（基础设施镜像）与 POSTGRES_PASSWORD，
#     其余应用配置（JWT / Embedding 等）与本文件无关。
# ============================================================

services:
  etcd:
    container_name: arag-etcd
    image: ${IMAGE_ETCD:-quay.io/coreos/etcd:v3.5.25}
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: arag-minio
    image: ${IMAGE_MINIO:-minio/minio:RELEASE.2024-05-28T17-19-04Z}
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: arag-milvus
    image: ${IMAGE_MILVUS:-milvusdb/milvus:v2.5.4}
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    expose:
      - "19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    container_name: arag-postgres
    image: ${IMAGE_POSTGRES:-postgres:16-alpine}
    environment:
      POSTGRES_DB: artoo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: arag-redis
    image: ${IMAGE_REDIS:-redis:7-alpine}
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:

# 共享外部网络：应用 compose 同样接入此网络，实现跨 compose 的服务名直连。
# 首次需手动创建： docker network create arag-network
networks:
  default:
    name: arag-network
    external: true
