# ============================================================
# Aladdin 本地中间件（仅中间件，amd64 专用）
# ------------------------------------------------------------
# 用途：在 amd64 (x86_64) 主机本地起 etcd/minio/milvus/postgres/redis，
#       后端(uvicorn)与 Worker、前端(npm run dev) 在宿主机本地运行。
# 参考：docker-compose.yml(本地) + deploy-arm64/docker-compose.yml(生产)。
#
# 关键点（针对之前 arm64 镜像在 amd64 上跑崩的问题，从根本上规避）：
#   - 每个服务显式 platform: linux/amd64，杜绝误用 arm64 镜像（QEMU 模拟会导致
#     milvus 直接 core dumped(signal 6)、redis 因 ARM64-COW-BUG 拒绝启动）。
#   - postgres 库名 = artoo（与 deploy 系列、LOCAL_WINDOWS_SETUP 文档一致）。
#   - 需要被宿主机直连的端口（milvus/postgres/redis）映射到本机；etcd/minio 仅内网。
#
# 启动： docker compose -f docker-compose-middleware-amd64.yml up -d
# 查看： docker compose -f docker-compose-middleware-amd64.yml ps
# 停止： docker compose -f docker-compose-middleware-amd64.yml down
# ============================================================

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    platform: linux/amd64
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    platform: linux/amd64
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4
    platform: linux/amd64
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: artoo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:
