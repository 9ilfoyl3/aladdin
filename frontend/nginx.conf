# WebSocket 升级映射：普通请求 Connection: close，WS 握手请求 Connection: upgrade。
# 本文件被 include 进 nginx 的 http {} 上下文（/etc/nginx/conf.d/default.conf），
# 故可在此声明 map。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # 允许上传大文件（默认 1MB 太小）
    client_max_body_size 500M;

    # 静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # API 代理 - 转发到后端服务
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级支持：会话文件上传状态推送走
        # WS /api/sessions/{sid}/files/events。缺少以下三行时 WS 握手无法完成，
        # 浏览器直接报 WebSocket 连接错误（第三方 AK/SK 客户端直连后端不经此代理，故不受影响）。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Chat API 代理（OpenAI 兼容接口）
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA 路由：所有未匹配路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，确保每次加载最新版本
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 运行时配置不缓存，确保部署人员修改后刷新即生效
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
