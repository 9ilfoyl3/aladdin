# TEI GPU 部署（AMD64 + NVIDIA）
# 用于独立的 GPU 服务器，提供 Embedding + Rerank API

services:
  tei-embedding:
    container_name: tei-embedding
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    command: ["--model-id", "/model", "--port", "80"]
    ports:
      - "8902:80"
    volumes:
      - ${MODEL_DIR:-./models}/bge-m3:/model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  tei-reranker:
    container_name: tei-reranker
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    command: ["--model-id", "/model", "--port", "80"]
    ports:
      - "8903:80"
    volumes:
      - ${MODEL_DIR:-./models}/bge-reranker-v2-m3:/model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
