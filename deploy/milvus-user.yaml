# ============================================================
# Milvus 用户级配置覆盖（standalone v2.5.x）
# 挂载到容器 /milvus/configs/user.yaml，与默认 milvus.yaml 合并，user.yaml 优先。
# 目的：开启 mmap（内存映射），把冷数据/索引放磁盘 + OS page cache，
#       降低单机常驻内存占用，让 Milvus 服务端按访问频率自动做冷热分层。
#       适用场景：单服务器部署、知识库数量随使用增长、内存与 PG/Redis/模型等争用。
#
# 改完后重启 Milvus 生效：
#   docker compose --profile infra up -d milvus
# ============================================================

mq:
  dispatcher:
    # 每个物理通道(pchannel)的最大 dispatcher/消费者数，默认 5。
    # collection 多时多个 vchannel 哈希到同一 pchannel，重启/恢复期集中 watch
    # 超过 5 个即注册失败并无限重试，形成 "consumer number limit exceeded"
    # 日志风暴（2026-08-21 生产事故：442G 日志写满磁盘的根因之一），
    # 且超限 collection 的数据通道中断。collection 持续增长场景需调大。
    maxDispatcherNumPerPchannel: 32

queryNode:
  mmap:
    # 向量原始数据走 mmap —— 省常驻内存最有效的一项（原始向量是内存大头）。
    vectorField: true
    # 向量索引保留在内存 —— 索引是检索速度的关键，留内存保查询延迟（保守起步）。
    # 若内存仍然紧张，可将其改为 true（会以略增检索延迟换取更低内存）。
    vectorIndex: false
    # 标量数据走 mmap（占内存不大，mmap 影响很小）。
    scalarField: true
    # 标量索引走 mmap（标量索引体积小，mmap 收益/代价均小，安全开启）。
    scalarIndex: true
    # 新增/增长段也启用 mmap，降低新写入数据的内存开销（略增受影响段的查询延迟）。
    growingMmapEnabled: true

  # chunk cache（mmap 命中后取回原始向量用）内存上限。
  # 混部机器上显式给 Milvus 划一块预算，而不是让它按整机 62G 自行推算。
  # 实测磁盘：顺序读写 206MB/s、4K QD1 延迟约 153µs（云 SSD，非机械盘），
  # 因此 mmap 命中后回读代价可接受，4G cache 足以覆盖热数据。
  cache:
    memoryLimit: 4294967296  # 4GB

# ============================================================
# 容量演进：何时把 vectorIndex 也改成 mmap
# ============================================================
# 1024 维（BGE-M3）下，索引常驻内存约 5KB/向量（vectorIndex: false 时）。
# compose 给 arag-milvus 的 mem_limit 是 12G，对应约 200 万向量的索引。
#
# 盯这条命令，RSS 逼近 10G 时把上面的 queryNode.mmap.vectorIndex 改为 true：
#     docker stats --no-stream arag-milvus
#
# 改 true 后索引也走磁盘 + page cache，内存占用大幅下降，代价是检索延迟上升
# （本机磁盘 206MB/s 有吞吐上限，高并发检索时可能成为瓶颈）。
# 若那时延迟不可接受，优先级应为：① 加内存 → ② 上 Milvus 集群分离 QueryNode。
# ============================================================
