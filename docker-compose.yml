# ============================================================
# Artoo 统一编排（唯一真源）
#
# 用 profiles 区分两组服务，不再拆多份文件：
#   infra —— 中间件：etcd / minio / milvus / postgres / redis
#   app   —— 应用：  backend / worker / frontend
#
# 配置全部走 .env（env_file 一把注入），compose 内只写「容器内固定值」
# （服务名、容器端口、连接串），用户无需也不应在 .env 里配它们。
#
# 常用命令：
#   生产单机（跳过 dev 端口暴露）：
#     docker compose -f docker-compose.yml --profile infra --profile app up -d
#   本地开发（自动加载 override 暴露中间件端口，应用用 make dev 跑在宿主机）：
#     docker compose --profile infra up -d
# ============================================================

services:
  # ============ 中间件（profile: infra）============
  etcd:
    container_name: arag-etcd
    image: quay.io/coreos/etcd:v3.5.25
    profiles: ["infra"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: arag-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: ["infra"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    # 健康检查用 MinIO 自带的 mc（镜像内置），不依赖 curl —— 该镜像无 curl，
    # 用 curl 探针会永久失败导致容器被标 unhealthy，进而阻断 milvus/backend 启动。
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: arag-milvus
    image: milvusdb/milvus:v2.5.4
    profiles: ["infra"]
    command: ["milvus", "run", "standalone"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
      # mmap 调优：把冷数据/原始向量放磁盘 + page cache，降低常驻内存。详见文件注释。
      - ./deploy/milvus-user.yaml:/milvus/configs/user.yaml:ro
    expose:
      - "19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    container_name: arag-postgres
    image: postgres:16-alpine
    profiles: ["infra"]
    # 抬高最大连接数：每个 backend/worker 进程一个连接池（pool 10 + overflow 20 = 上限 30）。
    # BACKEND_WORKERS=2 + 1 worker ≈ 峰值 90 连接，默认 100 余量过窄，设 200 留足。
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
    environment:
      POSTGRES_DB: artoo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: arag-redis
    image: redis:7-alpine
    profiles: ["infra"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============ 知识图谱（profile: graph，默认不启动）============
  # Neo4j + APOC，仅当显式带 --profile graph 才启动；不开图谱零成本。
  # 启动：docker compose --profile infra --profile graph up -d
  #       （应用侧还需在 .env 设 GRAPH_ENABLE=true 才会真正连接/抽取）
  neo4j:
    container_name: arag-neo4j
    image: neo4j:5-community        # 需 GDS（阶段 4 社区发现）时改 neo4j:5-enterprise
    profiles: ["graph"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 账号口令走 .env（与应用侧 NEO4J_USERNAME/NEO4J_PASSWORD 一致），默认 neo4j/password
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=2G
    ports:
      # 7474 = 浏览器管理台（HTTP），7687 = Bolt 驱动端口（应用经容器网络以 bolt://neo4j:7687 连接）
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  # ============ 应用（profile: app）============
  backend:
    container_name: arag-backend
    image: artoo-backend:latest
    build: ./backend
    profiles: ["app"]
    # 单机多进程，提升并发问答吞吐与单进程崩溃韧性。进程数由 BACKEND_WORKERS 控制。
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-2}"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # 业务可调配置统一从 .env 注入；下方 environment 只覆盖「容器内拓扑」固定值。
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/artoo
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - REDIS_URL=redis://redis:6379/0
      # 对象存储（知识库源文件权威存储）：复用 Milvus 的 MinIO，独立 bucket 隔离
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET=aladdin-documents
      # 知识图谱 Neo4j 连接（容器内拓扑固定值）。是否真正连接由 .env 的 GRAPH_ENABLE 控制，
      # 默认 false 即不连；账号口令走 .env 的 NEO4J_USERNAME/NEO4J_PASSWORD。
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - upload_data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    container_name: arag-worker
    image: artoo-backend:latest
    build: ./backend
    profiles: ["app"]
    command: ["python", "-m", "app.worker_main"]
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/artoo
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - REDIS_URL=redis://redis:6379/0
      # 对象存储（知识库源文件权威存储）：复用 Milvus 的 MinIO，独立 bucket 隔离
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET=aladdin-documents
      # 知识图谱 Neo4j 连接（容器内拓扑固定值）。GraphExtractWorker 抽取写图用；
      # 是否真正连接由 .env 的 GRAPH_ENABLE 控制，默认 false 即不连。
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - upload_data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: arag-frontend
    image: artoo-frontend:latest
    build: ./frontend
    profiles: ["app"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    # nginx.conf 已在镜像内（frontend/nginx.conf），无需挂载覆盖。
    # 运行时前端配置：只读挂载覆盖镜像内的 /config.js，部署人员改宿主机文件后刷新页面即生效，
    # 无需重新构建镜像。可调动态背景策略（prismBackground: auto/on/off）等。
    volumes:
      - ./frontend/public/config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:
  upload_data:
  neo4j_data:

networks:
  default:
    name: arag-network
